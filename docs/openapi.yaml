openapi: 3.2.0
info:
  title: Authentication & Authorization API
  version: 1.0.0
  description: |
    Production-grade Authentication and Authorization REST API service built with:
    - **Go 1.27** (net/http ServeMux routing, encoding/json/v2, gobreaker circuit breaker)
    - **PostgreSQL 18** (Native UUIDv7, SQLC, pgx/v5)
    - **Redis 8 Server** (via `go-redis/v9` & `redis_rate/v10`: verification tokens, refresh token rotation, task queue, GCRA rate limiting)
    - **Asynq & Mailpit** (Asynchronous email queue & SMTP delivery)
    - **Observability (LGTM & OpenTelemetry)** (Prometheus metrics, Tempo distributed tracing, Loki structured logging, Grafana dashboard)
  contact:
    name: API Support
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Authentication
    description: User registration, email verification, and session management
  - name: Administration
    description: Privileged administrative operations
  - name: Observability
    description: Prometheus metrics and system telemetry

paths:
  /metrics:
    get:
      tags:
        - Observability
      summary: Prometheus metrics endpoint
      description: |
        Exposes system, runtime Go, and HTTP metrics (requests total, request duration latency histogram, active requests, response size)
        in standard Prometheus text format for scraping.
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain; version=0.0.4:
              schema:
                type: string

  /api/auth/csrf:
    get:
      tags:
        - Authentication
      summary: Retrieve CSRF protection token
      description: |
        Generates a cryptographically random CSRF token (32-byte hex), sets the `_csrf` cookie
        with `SameSite=Lax`, and returns the token in JSON payload. Clients should include this token
        in the `X-CSRF-Token` header for state-changing requests.
      operationId: getCSRFToken
      responses:
        '200':
          description: CSRF token generated successfully
          headers:
            Set-Cookie:
              description: Sets the `_csrf` cookie with 24-hour expiration
              schema:
                type: string
                example: "_csrf=a1b2c3d4e5f6...; Path=/; Max-Age=86400; SameSite=Lax"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFTokenResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "failed to generate csrf token"

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user account
      description: |
        Registers a new user with Argon2id password hashing, saves records to PostgreSQL,
        stores a 24-hour verification token in Redis, and dispatches a verification email task via Asynq.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error or invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Key: 'CreateUserRequest.Email' Error:Field validation for 'Email' failed on the 'email' tag"
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "email already registered"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "internal server error"
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/auth/verify:
    get:
      tags:
        - Authentication
      summary: Verify user email address
      description: |
        Validates the UUID verification token against Redis, updates user status in PostgreSQL
        from `pending` to `active`, deletes the one-time token from Redis, and redirects the browser
        to the SvelteKit frontend (`${FRONTEND_URL}/register?verified=true`).
      operationId: verifyEmail
      parameters:
        - name: token
          in: query
          required: true
          description: UUID verification token delivered to user's email inbox
          schema:
            type: string
            format: uuid
            example: "01935693-bb6c-7d4a-aa76-e0278ceec002"
      responses:
        '303':
          description: Successful verification redirect to frontend SvelteKit page
          headers:
            Location:
              description: Frontend URL with verification status query parameter
              schema:
                type: string
                example: "http://localhost:5173/register?verified=true"
        '400':
          description: Missing token or token expired/invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingToken:
                  summary: Missing token parameter
                  value:
                    error: "token is required"
                expiredToken:
                  summary: Expired or non-existent token
                  value:
                    error: "invalid or expired verification token"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "internal server error"
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user & issue tokens
      description: |
        Authenticates user with email and password (Argon2id), verifies account status (`active`),
        issues a short-lived JWT Access Token (15m) and an Opaque Refresh Token (7d in Redis),
        and attaches them as secure `httpOnly` cookies.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserRequest'
      responses:
        '200':
          description: Successfully authenticated
          headers:
            Set-Cookie:
              description: Sets `access_token` and `refresh_token` as httpOnly cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error or invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "invalid request body"
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "invalid credentials"
        '403':
          description: Account email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "email not verified, please check your email inbox"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "internal server error"
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access and refresh tokens (RTR)
      description: |
        Rotates the refresh token (Refresh Token Rotation - RTR) and issues a new access token.
        Accepts the refresh token via JSON body (`refresh_token`) or via httpOnly cookie.
        The old refresh token is invalidated immediately in Redis.
      operationId: refreshToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          headers:
            Set-Cookie:
              description: Sets rotated `access_token` and `refresh_token` as httpOnly cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "refresh token is required"
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "invalid or expired refresh token"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "internal server error"
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user session
      description: |
        Revokes the refresh token from Redis and clears authentication cookies (`access_token` and `refresh_token`)
        from the browser.
      operationId: logoutUser
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logged out successfully
          headers:
            Set-Cookie:
              description: Clears `access_token` and `refresh_token` cookies (Max-Age=0)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "logged out successfully"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "internal server error"
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset link
      description: |
        Generates a 15-minute reset token in Redis and dispatches an email with reset instructions via Asynq.
        Implements anti-user enumeration: returns 200 OK regardless of whether email is registered.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Request accepted (anti-enumeration message)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Jika email terdaftar di sistem kami, instruksi reset kata sandi telah dikirimkan ke kotak masuk Anda."
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Key: 'ForgotPasswordRequest.Email' Error:Field validation for 'Email' failed on the 'email' tag"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "internal server error"
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset user password with token
      description: |
        Validates the one-time reset token from Redis, updates the user's password hash using Argon2id in PostgreSQL,
        deletes the token from Redis, and revokes all existing refresh tokens (sessions) for this user.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          headers:
            Set-Cookie:
              description: Clears existing authentication cookies (Max-Age=0)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '400':
          description: Invalid/expired token or password validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "invalid or expired reset token"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "internal server error"
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: Resend account verification email
      description: |
        Generates a new 24-hour verification token in Redis and dispatches an email via Asynq.
        Implements anti-user enumeration: returns 200 OK regardless of whether email is registered or already verified.
      operationId: resendVerificationEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationEmailRequest'
      responses:
        '200':
          description: Request accepted (anti-enumeration message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationEmailResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Key: 'ResendVerificationEmailRequest.Email' Error:Field validation for 'Email' failed on the 'email' tag"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "internal server error"
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current authenticated user profile
      description: |
        Returns the profile of the authenticated user identified by the JWT Bearer access token.
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "authorization header is required"
        '403':
          description: Account is inactive or suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "account is inactive or suspended"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "user not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "internal server error"
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/admin/users:
    get:
      tags:
        - Administration
      summary: List all users (Admin only)
      description: |
        Protected endpoint that requires both a valid JWT Bearer access token and the `admin` role.
        Returns a list of all registered users in the database.
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized - missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "authorization header is required"
        '403':
          description: Forbidden - caller does not have the admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "forbidden: insufficient permissions"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "internal server error"
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/admin/audit-logs:
    get:
      tags:
        - Administration
      summary: List audit logs with pagination (Admin only)
      description: |
        Protected endpoint that requires both a valid JWT Bearer access token and the `admin` role.
        Returns a paginated list of immutable security audit logs (actor, action, resource, IP, user-agent, metadata, timestamp).
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination (starts at 1)
          required: false
          schema:
            type: integer
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of audit log entries per page (max 100)
          required: false
          schema:
            type: integer
            default: 20
            example: 20
      responses:
        '200':
          description: Paginated audit logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogsResponse'
        '401':
          description: Unauthorized - missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "authorization header is required"
        '403':
          description: Forbidden - caller does not have the admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "forbidden: insufficient permissions"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "internal server error"
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    TooManyRequestsResponse:
      description: Rate limit exceeded (RFC 6585)
      headers:
        X-RateLimit-Limit:
          description: Request limit quota per time window
          schema:
            type: integer
            example: 5
        X-RateLimit-Remaining:
          description: Remaining request count in the current window
          schema:
            type: integer
            example: 0
        X-RateLimit-Reset:
          description: Unix epoch timestamp when the rate limit window resets
          schema:
            type: integer
            example: 1732464000
        Retry-After:
          description: Number of seconds to wait before retrying
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "too many requests, please try again in 60 seconds"
  schemas:
    CreateUserRequest:
      type: object
      required:
        - full_name
        - email
        - password
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 255
          description: Full name of the user
          example: "Nilou Mirei"
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
          description: Unique, valid email address
          example: "nilou@example.com"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          description: Plain text password (hashed using Argon2id with default memory parameters)
          example: "SecretP@ss123"

    LoginUserRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
          description: User's registered email address
          example: "nilou@example.com"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          description: User's account password
          example: "SecretP@ss123"

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Opaque refresh token received from login or previous refresh
          example: "a8f5b2c910e34d7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a"

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Optional refresh token to invalidate if not supplied via cookie
          example: "a8f5b2c910e34d7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a"

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Registered account email address
          example: "nilou@example.com"

    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
        - confirm_new_password
      properties:
        token:
          type: string
          description: One-time reset token received from email
          example: "01935693-bb6c-7d4a-aa76-e0278ceec002"
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          description: New password to set
          example: "NewP@ssw0rd123"
        confirm_new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          description: Confirmation matching new_password
          example: "NewP@ssw0rd123"

    ResetPasswordResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "password has been reset successfully, please login with your new password"

    ResendVerificationEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Registered account email address requiring verification
          example: "nilou@example.com"

    ResendVerificationEmailResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Jika email terdaftar dan belum diverifikasi, tautan verifikasi baru telah dikirimkan ke kotak masuk Anda."

    UserResponse:
      type: object
      required:
        - id
        - full_name
        - email
        - role
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Native UUIDv7 primary identifier
          example: "01935693-bb6c-7d4a-aa76-e0278ceec002"
        full_name:
          type: string
          description: Full name of the user
          example: "Nilou Mirei"
        email:
          type: string
          format: email
          description: User's registered email address
          example: "nilou@example.com"
        role:
          type: string
          description: User role in the system
          enum: [member, admin]
          default: member
          example: "member"
        status:
          type: string
          description: Account verification status
          enum: [pending, active, suspended]
          default: pending
          example: "pending"
        token_version:
          type: integer
          description: Incrementing security token version for instant session revocation
          example: 1
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp
          example: "2026-11-22T04:00:55Z"
        updated_at:
          type: string
          format: date-time
          description: Account last update timestamp
          example: "2026-11-22T04:00:55Z"

    AuthResponse:
      type: object
      required:
        - user
        - expires_at
      properties:
        token_type:
          type: string
          example: "Bearer"
        access_token:
          type: string
          description: Signed JWT Access Token (15 minutes lifespan)
        refresh_token:
          type: string
          description: Opaque Refresh Token stored in Redis (7 days lifespan)
        expires_at:
          type: string
          format: date-time
          description: Absolute expiration time of the access token
          example: "2026-11-22T04:15:55Z"
        user:
          $ref: '#/components/schemas/UserResponse'

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "invalid request body"

    AuditLogResponse:
      type: object
      required:
        - id
        - action
        - resource_type
        - status
        - ip_address
        - user_agent
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the audit log record
          example: "01935693-bb6c-7d4a-aa76-e0278ceec002"
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the actor who performed the action
          example: "01935693-bb6c-7d4a-aa76-e0278ceec002"
        actor_email:
          type: string
          format: email
          nullable: true
          description: Email of the actor
          example: "admin@example.com"
        actor_role:
          type: string
          nullable: true
          description: Role of the actor
          example: "admin"
        action:
          type: string
          description: System security event action identifier
          example: "auth.login"
        resource_type:
          type: string
          description: Type of resource affected
          example: "session"
        resource_id:
          type: string
          nullable: true
          description: Identifier of the resource
          example: "01935693-bb6c-7d4a-aa76-e0278ceec002"
        status:
          type: string
          description: Outcome status of the action (success or failure)
          example: "success"
        ip_address:
          type: string
          description: Client IP address
          example: "127.0.0.1"
        user_agent:
          type: string
          description: Client User-Agent string
          example: "Mozilla/5.0 (X11; Linux x86_64)"
        metadata:
          type: object
          description: Additional contextual JSON metadata
          example:
            reason: "invalid_credentials"
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2026-11-24T23:14:00Z"

    PaginatedAuditLogsResponse:
      type: object
      required:
        - data
        - total_count
        - page
        - limit
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogResponse'
        total_count:
          type: integer
          description: Total number of audit logs recorded in system
          example: 42
        page:
          type: integer
          description: Current page number
          example: 1
        limit:
          type: integer
          description: Max entries per page
          example: 20

    CSRFTokenResponse:
      type: object
      required:
        - csrf_token
      properties:
        csrf_token:
          type: string
          description: 64-character hexadecimal CSRF defense token
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
