server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: auth-api-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth-api
          env: development
          __path__: /var/log/auth-api/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            request_id: request_id
            trace_id: trace_id
            span_id: span_id
            path: path
            status: status
            msg: msg
      - labels:
          level:
          status:
